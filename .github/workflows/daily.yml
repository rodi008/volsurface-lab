name: Daily refresh

# Deribit settles its daily options at 08:00 UTC. At 08:40 the expired slice is
# gone from the chain and the next one is fully quoted. GitHub may start a
# scheduled run some minutes late under load; nothing here depends on the minute.
on:
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'out/history.jsonl'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Exits non-zero when the health gate fails. The job stops here, nothing
      # is deployed, and the site keeps serving the previous day.
      - name: Fetch, calibrate and gate (BTC)
        run: node bin/lab.js update

      # Ether is additive. If its run fails the bitcoin page still deploys and
      # the site simply carries one asset that day: site.js builds whatever
      # snapshots exist, and the switcher follows.
      - name: Fetch, calibrate and gate (ETH)
        continue-on-error: true
        run: node bin/lab.js update --currency=ETH

      - name: Build site
        run: node bin/site.js

      # History is the one piece of state that has to outlive the runner, so it
      # is committed back. A push made with GITHUB_TOKEN never triggers another
      # workflow run, so this cannot loop. The daily commit also counts as
      # repository activity, which keeps GitHub from disabling the schedule
      # after 60 quiet days.
      - name: Record history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/history*.jsonl
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "history: $(date -u +%Y-%m-%d)"
            # Anything pushed to main since checkout would reject a plain push
            # and take the deploy down with it. Only this job writes the
            # history file and runs never overlap, so the rebase only ever
            # replays this one commit onto unrelated changes.
            git pull --rebase origin main
            git push
          fi

      # Pages serves only public repositories on a free plan. While this one is
      # private a deploy would fail every day, so it is skipped instead and the
      # history keeps growing without a daily failure mail. GitHub drops the
      # Pages setting when a repository goes private, so going public again
      # also means re-enabling Pages (source: GitHub Actions); until then the
      # deploy fails loudly, which is the reminder. Scheduled runs carry no
      # repository payload, so visibility is read from the API.
      - name: Check visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "public=$(gh api "repos/${{ github.repository }}" --jq '.private | not')" >> "$GITHUB_OUTPUT"

      - if: steps.visibility.outputs.public == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
